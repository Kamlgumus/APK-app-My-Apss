name: APK Build
on:
  workflow_dispatch:
  push:
    paths: ['*.zip']
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - uses: android-actions/setup-android@v3
      - name: ZIP ac
        run: |
          mkdir project && unzip -o *.zip -d project
          if [ "$(ls project | wc -l)" = "1" ]; then mv project/*/* project/ 2>/dev/null || true; fi
      - name: Derle (Gradle projesi)
        run: |
          cd project
          chmod +x gradlew 2>/dev/null
          ./gradlew assembleDebug --stacktrace
      - name: APK yukle
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: apk-sonuc
          path: |
            project/**/*.apk
            apkforge_errors.log
